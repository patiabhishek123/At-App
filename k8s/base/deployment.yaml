apiVersion: apps/v1
kind: Deployment
metadata:
  name: atapp-server
  labels:
    app: atapp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atapp-server
  template:
    metadata:
      labels:
        app: atapp-server
    spec:
      securityContext:
        runAsNonRoot: true
        # Distroless's "nonroot" user (UID 65532) is a symbolic name the
        # image doesn't expose in a way kubelet can resolve at admission
        # time to verify runAsNonRoot; without an explicit numeric UID here,
        # the pod fails to start with CreateContainerConfigError.
        runAsUser: 65532
      containers:
        - name: atapp-server
          image: atapp-server:latest # replaced per-overlay via kustomize images:
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: atapp-server-config
            - secretRef:
                name: atapp-server-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
      terminationGracePeriodSeconds: 15
