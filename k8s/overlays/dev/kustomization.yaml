apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: atapp-dev

resources:
  - ../../base

images:
  - name: atapp-server
    newName: atapp-server
    newTag: dev

replicas:
  - name: atapp-server
    count: 1

patches:
  - target:
      kind: Deployment
      name: atapp-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atapp-server
      spec:
        template:
          spec:
            containers:
              - name: atapp-server
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 250m
                    memory: 128Mi
  - target:
      kind: ConfigMap
      name: atapp-server-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atapp-server-config
      data:
        APP_ENV: development
        ALLOWED_ORIGINS: "*"
