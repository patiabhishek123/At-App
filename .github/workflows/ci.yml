name: AtApp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atapp_user
          POSTGRES_PASSWORD: atapp_password
          POSTGRES_DB: atapp_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: go mod download
        working-directory: server

      - name: Run golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: server
          args: --timeout=5m
        # TODO: flip to blocking (remove continue-on-error) once a clean run
        # against the current codebase has been confirmed — not verified as
        # part of the change that added this comment.
        continue-on-error: true

      - name: Run Tests
        # -p 1: test packages share one Postgres database and each resets its
        # schema at startup, so packages must not run concurrently.
        run: go test -p 1 -v ./...
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: atapp_user
          DB_PASSWORD: atapp_password
          DB_NAME: atapp_db
          REDIS_ADDR: localhost:6380

      - name: Build
        run: go build -v ./...
        working-directory: server

  admin-frontend:
    name: Admin Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin_web

      - name: Lint
        run: npm run lint
        working-directory: admin_web

      - name: Build
        run: npm run build
        working-directory: admin_web

  mobile-frontend:
    name: Mobile Frontend CI (Flutter)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ student_app, teacher_app ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Get packages
        run: flutter pub get
        working-directory: ${{ matrix.app }}

      - name: Analyze
        run: flutter analyze
        working-directory: ${{ matrix.app }}

      - name: Test
        run: flutter test
        working-directory: ${{ matrix.app }}

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: atapp-server:ci
